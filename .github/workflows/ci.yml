# Test the QA probe suite and the save-format compatibility gate, then deploy
# the built game to GitHub Pages: giveen.github.io/cookie-clicker-3/
#
# test:        drives the in-page ?debug=1&qa=… probes (tests/qa.spec.js) in
#              headless Chromium against a fresh `npm run build` + `vite preview`
#              — the same artifacts the deploy publishes.
# test-compat: save-compat spec (tests/save-compat.spec.js) — imports a save
#              exported from the PRISTINE master branch into this tree and
#              diffs the re-exports, so a save-format break can't merge. The
#              baseline is materialized by checking out master into
#              .cc3-master/ (playwright.config.js serves it on :4174).
# deploy:      only runs when both test jobs pass (and never on PRs). Replaces
#              the gh-pages branch with the fresh dist/ (peaceiris/actions-gh-pages).
#              The relocatable build (base './') serves from the repo subpath, and
#              the per-build service-worker cache stamp (vite.config.ts) makes each
#              deploy self-updating for returning players.

name: Test & Deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # the deploy job pushes dist/ to the gh-pages branch

# Deploys are short; never cancel one in flight — a torn gh-pages branch is
# worse than a queued duplicate.
# The group is scoped per-branch: one global group let a stuck run on a PR
# branch (its workflow snapshot still had the apt-stalling --with-deps
# install) hold master's test-and-deploy in the queue behind it. Per-branch
# groups still serialize master's deploys against each other (the protection
# this exists for) while letting PRs run independently of the mainline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GitHub-hosted runners already ship the system libraries Playwright
      # needs, so no --with-deps (that apt pass can stall minutes on a
      # dpkg lock held by the runner's background updates).
      - run: npx playwright install chromium
      # playwright.config.js webServer builds the production bundle itself.
      # Scoped to tests/qa.spec.js: the save-compat and playthrough specs are
      # explicit extras (they need extra servers / are timing-sensitive).
      - run: npx playwright test tests/qa.spec.js
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Save-format compatibility gate: a save exported from PRISTINE master must
  # import into this tree and re-export byte-identically (modulo lastDate and
  # append-only zeros). Master itself is materialized as a read-only baseline
  # checkout — commits land on the real branches, never here.
  test-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      # Pristine master as the compat baseline. `actions/checkout` refuses a
      # nested `path` inside the workspace, so this is a manual fetch + checkout
      # (git worktree add is unavailable on shallow clones without unshallowing).
      - name: Check out pristine master into .cc3-master/
        run: |
          git fetch --no-tags --depth=1 origin master
          git worktree add --detach .cc3-master FETCH_HEAD
      - name: Install + build baseline
        run: |
          npm ci --no-audit --no-fund --prefix .cc3-master
          npm run build --prefix .cc3-master
      - run: npx playwright test tests/save-compat.spec.js
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-compat
          path: playwright-report/
          retention-days: 14

  deploy:
    needs: [test, test-compat]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Replaces the branch contents with dist/ (keep_files defaults to false).
      # The stamp step in the build fails the run if the service-worker cache
      # placeholder ever goes missing, so a broken deploy can't publish.
      - name: Publish dist/ to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          # this action does not pick up the default GITHUB_TOKEN env var
          github_token: ${{ github.token }}
          publish_dir: ./dist
